name: Build release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache Vosk models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/vosk
          key: vosk-hi-0.22-en-in-0.4-v1

      - name: Download Vosk models
        run: |
          mkdir -p app/src/main/assets/vosk
          cd app/src/main/assets/vosk
          fetch_model() {
            local file="$1"
            local sha="$2"
            local url="https://alphacephei.com/vosk/models/$file"
            if [ -f "$file" ] && echo "$sha  $file" | sha256sum -c - >/dev/null 2>&1; then
              return
            fi
            rm -f "$file"
            curl -fL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
          }
          fetch_model vosk-model-small-hi-0.22.zip \
            7c50a10866889f0ac21d912c20537a055a597ed09fc1d3e5bcd798f9f0017e48
          fetch_model vosk-model-small-en-in-0.4.zip \
            20663dcac4d5cb783a579c54d98339344a688e4ec6e1b4a4b059fd1235454cc7
          ls -lh

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.p12
          test -s keystore/release.p12

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          ls -lh app/build/outputs/apk/release/
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HindiVoiceAssistant-v1.0.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiVoiceAssistant-v1.0.1
          path: dist/HindiVoiceAssistant-v1.0.1.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HindiVoiceAssistant-v1.0.1.apk
          generate_release_notes: true
